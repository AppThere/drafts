## Version catalog for AppThere Drafts.
##
## Every version here is pinned to an exact release. No dynamic ranges ("1.2.+", "latest.release")
## and no version-less declarations: a reproducible build on a clean clone is a Phase 0 acceptance
## criterion, and a dynamic range silently breaks it the first time an upstream publishes.

[versions]

# --- Language and build ---------------------------------------------------------------------
# Kotlin, AGP and Compose Multiplatform are held at the set verified to build and run on this
# machine (desktop app launched, Android APK installed on an android-36 emulator). Newer releases
# exist -- Kotlin 2.4.20, AGP 9.4.0, CMP 1.12.0 -- but moving all three at once is a change with
# its own verification cost and no Phase 0 benefit. See the Phase 0 report, item 5.
kotlin = "2.4.10"
agp = "9.0.1"
composeMultiplatform = "1.11.1"

# --- Android SDK levels ---------------------------------------------------------------------
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# --- Static analysis and quality gates ------------------------------------------------------
# detekt 1.23.8 is the final release under the io.gitlab.arturbosch.detekt coordinates named in
# engineering-conventions.md 3. Development has since moved to dev.detekt 2.x, which is still
# alpha. Verified: 1.23.8 runs on Gradle 9.1 (one "incompatible with Gradle 10" deprecation).
detekt = "1.23.8"

# compose-rules 0.4.22 is the last release built against detekt 1.x. The 0.6.x line requires
# dev.detekt 2.0.0-alpha. These two lines cannot be mixed.
composeRules = "0.4.22"

konsist = "0.17.3"
spotless = "8.10.2"
kover = "0.9.9"
dependencyAnalysis = "3.19.1"

# ktlint used by Spotless. Deliberately NOT matched to the ktlint 0.50.0 that detekt-formatting
# 1.23.8 embeds -- see config/detekt/detekt.yml, "formatting" ruleset, for why Spotless owns
# formatting and the detekt formatting ruleset is scoped away from it.
ktlint = "1.8.0"

# --- Libraries -------------------------------------------------------------------------------
kotlinx-coroutines = "1.11.0"
# Tied to the Kotlin version: the compiler plugin and the runtime are released together.
kotlinx-serialization = "1.9.0"
androidxTestRunner = "1.6.2"

# JetBrains/markdown (intellij-markdown). markdown-dialect.md's "Recommendation" section picks
# this: the only candidate with institutional backing, and its ASTNode already carries exact
# source offsets, which is the hard part for an editor. Publishes iosArm64 and iosSimulatorArm64
# alongside JVM, so it covers the whole target matrix.
intellijMarkdown = "0.7.13"
androidx-activity = "1.13.0"

[libraries]

# Test infrastructure
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# detekt: rule authoring (used by :tools-detekt-rules) and rule testing
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }

# detekt: plugins loaded into the detekt runtime for analysis
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
composeRules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }

# Konsist: architecture assertions as tests
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Coroutines: declared for the desktop dispatcher and for the runBlocking rule's test fixtures
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Session and snapshot metadata is JSON (appthere-drafts.md 7.3). Hand-rolling it would repeat the
# mistake engineering-conventions.md 4.2 bans for XML: a displayName carrying a quote, a backslash
# or a control character is exactly the case a hand-written writer gets wrong, and the file that
# results is the one holding somebody's unsaved work.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

intellij-markdown = { module = "org.jetbrains:markdown", version.ref = "intellijMarkdown" }

# Gradle plugin artifacts, referenced by the build-logic included build so that convention
# plugins can apply them without re-declaring versions.
plugin-kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-compose-gradle = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
plugin-composeCompiler-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
plugin-detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
plugin-spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-dependencyAnalysis-gradle = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependencyAnalysis" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dependencyAnalysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
